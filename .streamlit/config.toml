# 일잇다 화면 테마. 단정한 한국어 업무 도구 톤.
[theme]
base = "light"
primaryColor = "#167D68"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B2A"
linkColor = "#167D68"
borderColor = "#E2E7E5"
dataframeBorderColor = "#E2E7E5"
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 15
font = "Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"
headingFont = "Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"
headingFontSizes = ["1.75rem", "1.375rem", "1.125rem", "1rem", "0.9375rem", "0.875rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"

[client]
toolbarMode = "minimal"   # 오른쪽 위 Deploy·메뉴를 숨겨 제품 화면처럼

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
